# Enable AndroidX for the Android dependencies used by COM11H Shop
android.useAndroidX=true
android.enableJetifier=true

# Cấp đủ RAM cho tiến trình build (R8/minify và lint rất tốn heap).
# Không có dòng này, Gradle chỉ dùng heap mặc định (thường quá nhỏ trên
# GitHub Actions) và bị "OutOfMemoryError: Java heap space" khi minifyRelease.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.incremental=true
